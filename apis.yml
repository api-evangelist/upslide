aid: upslide
name: UpSlide
description: >-
  UpSlide is a French B Corp-certified software company whose Microsoft 365
  add-in automates document production for financial services firms —
  investment banking, private equity, advisory, and asset management. UpSlide
  links Excel data into PowerPoint and Word, manages branded template and
  content libraries, and layers AI features (slide generation, consistency
  checking) on dedicated per-client Azure AI Foundry instances. It ships an
  official remote MCP server (api.upslide.com/mcp) plus downloadable Agent
  Skills that connect Claude and Microsoft 365 Copilot to the add-in. UpSlide
  is SOC 2 Type II and ISO 27001 certified, and is backed by Partech.
