apis:
- name: UpSlide MCP Server
  description: >-
    Official remote MCP (Model Context Protocol) server that connects AI
    assistants such as Claude Desktop and Microsoft 365 Copilot to the UpSlide
    add-in. Exposes selected UpSlide features (Excel link listing, AI Slide
    Generator, consistency check) via Streamable HTTP; access is mapped to the
    user's UpSlide license through Microsoft Entra ID admin consent. Tool
    execution is local — the server relays instructions to the desktop add-in
    and persists no business data.
  humanURL: https://support.upslide.net/hc/en-us/articles/27412396550812-UpSlide-MCP
